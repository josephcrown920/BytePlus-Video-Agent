openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /share:
    post:
      operationId: createShareLink
      tags: [share]
      summary: Create a public share link
      description: Saves an authenticated user's script or storyboard as a public immutable snapshot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShareResponse"
        "400":
          description: Invalid share payload
        "401":
          description: Authentication required
  /share/{id}:
    get:
      operationId: getSharedContent
      tags: [share]
      summary: Get public shared content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared script or storyboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedContent"
        "404":
          description: Shared content not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateShareRequest:
      type: object
      properties:
        type:
          type: string
          enum: [script, storyboard]
        data:
          type: object
          additionalProperties: true
      required:
        - type
        - data
    CreateShareResponse:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
      required:
        - id
        - url
    SharedContent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [script, storyboard]
        title:
          type: string
        data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - data
        - created_at

